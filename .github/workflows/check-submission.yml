name: Check submission

# Runs on pull requests that add or change submissions. The checker code and the
# rules (scopes.toml, points.toml, data/contributions.csv) come from the BASE
# branch; only the submission files are read from the pull request, so a PR
# cannot change the rules it is checked against.

on:
  pull_request:
    paths: ["submissions/**"]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out trusted code and rules (base branch)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: base
          persist-credentials: false

      - name: Check out the pull request
        uses: actions/checkout@v4
        with:
          path: pr
          fetch-depth: 2
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate and verify submissions
        working-directory: base
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
        run: |
          # The PR checkout is the merge commit; its first parent is the base branch.
          mapfile -t files < <(git -C ../pr diff --name-only --no-renames HEAD^1 HEAD)
          printf 'Changed: %s\n' "${files[@]}"
          python -m giveback_board check --root ../pr --config-root . \
            --author "$PR_AUTHOR" --summary "$GITHUB_STEP_SUMMARY" "${files[@]}"
